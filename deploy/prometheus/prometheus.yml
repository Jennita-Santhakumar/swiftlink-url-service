global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'url-shortener-api'
    static_configs:
      - targets: ['api:8080']
        labels:
          component: api

  - job_name: 'url-shortener-worker'
    static_configs:
      - targets: ['worker:9114']
        labels:
          component: worker
